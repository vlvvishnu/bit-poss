<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#F9F7F4"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="BITE."/>
  <meta name="description" content="BITE. POS — The smart POS for modern restaurants by Pay4"/>
  <title>BITE. — Delivery</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon.svg?v=3"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4"/>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="root"></div>
  <script>var quickQtyProductId = null;</script>
  <script>
    window.__biteDeferredPrompt = null

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        let refreshing = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return
          refreshing = true
          window.location.reload()
        })

        // One-time hard reset for stale SW/bundle issues.
        const CACHE_RESET_VERSION = 'sw-reset-v2'
        if (localStorage.getItem(CACHE_RESET_VERSION) !== 'done') {
          const regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.map(r => r.unregister()))
          const keys = await caches.keys()
          await Promise.all(keys.map(k => caches.delete(k)))
          localStorage.setItem(CACHE_RESET_VERSION, 'done')
          window.location.reload()
          return
        }

        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[BITE] SW registered')

            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' })
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing
              if (!newWorker) return
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' })
                }
              })
            })
          })
          .catch(e => console.log('[BITE] SW failed:', e))
      })
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
